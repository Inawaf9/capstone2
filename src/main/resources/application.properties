spring.application.name=meeting-point

# ===============================
# SERVER
# ===============================

server.port=8080

# ===============================
# DATABASE - MYSQL
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/meeting_point
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# GOOGLE MAPS
# ===============================

google.maps.api-key=${GOOGLE_MAPS_API_KEY}

google.places.base-url=https://places.googleapis.com

google.routes.base-url=https://routes.googleapis.com


# ===============================
# OPENROUTER
# ===============================

spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1

spring.ai.openai.chat.model=google/gemini-3.8-flash

spring.ai.openai.timeout=120s
spring.ai.openai.max-retries=1


# ===============================
# EMAIL
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000